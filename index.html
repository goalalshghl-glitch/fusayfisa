<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>فسيفساء</title>
  <meta name="description" content="فسيفساء — مكتبة مراجعك الشخصية: صور وملفات محفوظة على جهازك.">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141617" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="فسيفساء">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10.5 7.5h2.8a3 3 0 0 1 0 6h-2.3M10.5 7.5 9 21"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  </svg>

  <button class="dot" id="dot" type="button" aria-label="عن فسيفساء"></button>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#/" aria-label="فسيفساء — الرئيسية">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <b>فسيفساء</b>
      </a>
      <button class="add" type="button" data-add aria-label="إضافة مرجع"><svg class="ic"><use href="#i-plus"/></svg><span>إضافة</span></button>
    </div>
    <div class="search-row">
      <label class="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="q" placeholder="ابحث في مراجعك…" aria-label="بحث" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="pin" id="pin" type="button" aria-label="ابحث في Pinterest" title="ابحث في Pinterest"><svg class="ic"><use href="#i-pin"/></svg><span>Pinterest</span></button>
    </div>
  </header>

  <div id="packStatus" class="pack-status" hidden aria-live="polite"></div>
  <div id="aiStatus" class="ai-status" hidden aria-live="polite"></div>
  <main id="main" class="main"></main>

  <nav class="nav" aria-label="التنقل">
    <a href="#/" data-nav="/"><svg class="ic"><use href="#i-home"/></svg><span>الرئيسية</span></a>
    <a href="#/fav" data-nav="/fav"><svg class="ic"><use href="#i-heart"/></svg><span>المفضلة</span></a>
  </nav>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
